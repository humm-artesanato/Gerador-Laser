<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de caixas a laser – MDF 3 mm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf6f0;--card:#fff;--tx:#2b2620;--mut:#7a7064;--bd:#e2d9cc;--ac:#8a5a2b;--acx:#fff;--pv:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1713;--card:#26211c;--tx:#efe7dc;--mut:#a39787;--bd:#3a332b;--ac:#d9a066;--acx:#1b1713;--pv:#f4efe8}}
:root[data-theme="dark"]{--bg:#1b1713;--card:#26211c;--tx:#efe7dc;--mut:#a39787;--bd:#3a332b;--ac:#d9a066;--acx:#1b1713;--pv:#f4efe8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}p.s{margin:0 0 14px;color:var(--mut)}
.g{display:grid;gap:14px;grid-template-columns:300px 1fr}@media(max-width:760px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 12px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:inherit;cursor:pointer;margin:8px 6px 0 0}
button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.pv{background:var(--pv);border-radius:8px;overflow-x:auto;border:1px solid var(--bd)}.pv svg{display:block;height:auto}
.vt{display:flex;gap:8px;align-items:center;margin-bottom:8px}.vt button{margin:0}
.zb{display:flex;align-items:center;gap:8px;margin-bottom:8px}.zb button{margin:0}.zb input{flex:1;width:auto;padding:0}.zb span{min-width:42px;text-align:right;font-size:13px;color:var(--mut)}
.i{font-size:13px;color:var(--mut);margin-top:10px}.w{color:#b3261e;font-size:13px;margin-top:8px}
</style>
</head>
<body><main>
<h1>Gerador de caixas a laser</h1>
<p class="s">MDF 3 mm · medidas em mm · saída em SVG (vermelho = corte)</p>
<div class="g">
<div class="c">
<label>Tipo de caixa<select id="tp"><option value="bs">Caixas basculantes</option><option value="cf">Caixa fechada</option></select></label>
<label>Variação<select id="vr"><option value="lat">Dobradiça lateral</option><option value="tr">Dobradiça traseira</option></select></label>
<label>Medidas informadas<select id="un"><option value="int">Internas</option><option value="ext">Externas</option></select></label>
<label id="lLid">Tampa<select id="lid"><option value="yes">Com tampa</option><option value="no">Sem tampa (topo liso)</option></select></label>
<label><span id="tLi">Largura interna</span><input id="Li" type="number" value="100" min="20"></label>
<label><span id="tPi">Profundidade interna</span><input id="Pi" type="number" value="150" min="60"></label>
<label><span id="tAi">Altura interna total (tampa fechada)</span><input id="Ai" type="number" value="30" min="20"></label>
<label id="lHl"><span id="tHl">Altura interna da tampa</span><input id="Hl" type="number" value="10" min="5"></label>
<label id="lPm">Raio do pino da dobradiça (× espessura, mín. 1,2)<input id="pm" type="number" step="0.1" value="1.3" min="1.2"></label>
<label id="lSm">Anel da dobradiça (× espessura, mín. 0,6)<input id="sm" type="number" step="0.1" value="1" min="0.6"></label>
<label id="lNh">Divisórias horizontais (ao longo da largura)<input id="nh" type="number" value="0" min="0" max="12"></label>
<label id="lNv">Divisórias verticais (ao longo da profundidade)<input id="nv" type="number" value="0" min="0" max="12"></label>
<label id="lHd"><span id="thd">Altura das divisórias</span><input id="hd" type="number" placeholder="máx." min="12"></label>
<label id="lDt">Fixar divisórias também na tampa<select id="dt"><option value="no">Não</option><option value="yes">Sim (altura total)</option></select></label>
<label id="lW"><span id="tw">Largura alvo dos dentes</span><input id="w" type="number" value="10" min="5"></label>
<label>Chapa: largura máx. (mm)<input id="sw" type="number" value="380" min="100"></label>
<label>Chapa: altura máx. (mm)<input id="sh" type="number" value="300" min="100"></label>
<label id="lMode">Modo de corte<select id="mode"><option value="sep">Peças separadas</option><option value="mid">Agrupado (meio-termo)</option><option value="uni">Aproveitamento de corte (linha comum)</option></select></label>
<div class="i" id="info"></div><div class="w" id="warn"></div>
<button id="dl">Baixar SVG</button><button class="o" id="cp">Copiar SVG</button>
</div>
<div class="c"><div class="vt"><button id="v2">Planificação</button><button class="o" id="v3">3D</button><label id="lop" style="display:none;margin:0 0 0 auto">Abrir tampa <input id="lo" type="range" min="0" max="110" value="0" style="width:120px"></label></div><div class="zb" id="zb"><button class="o" id="zm">−</button><input id="zs" type="range" min="10" max="200" step="5" value="100"><button class="o" id="zp">+</button><span id="zv">100%</span></div><div class="pv" id="pv"></div><div class="pv" id="cv" style="display:none;overflow:hidden"></div><div class="i" id="cvm" style="display:none;padding:14px">A visualização 3D ainda não está disponível para este tipo de caixa (dobradiça embutida).</div></div>
</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=3,$=id=>document.getElementById(id);
const odd=(L,w)=>Math.max(3,2*Math.round((L/w-1)/2)+1);
// aresta com dentes: F=true começa projetando (o=normal externa)
function fe(p,q,n,F,o){const r=[];for(let i=0;i<n;i++){const k=((i%2==0)==F)?T:0;
 for(const u of[i/n,(i+1)/n])r.push([p[0]+(q[0]-p[0])*u+o[0]*k,p[1]+(q[1]-p[1])*u+o[1]*k]);}return r}
const circ=(cx,cy,r,a0=0,a1=360,n=40)=>{const r_=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;r_.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return r_};
const rect=(cx,cy,w,h)=>[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]];
const mir=s=>({...s,pts:s.pts.map(p=>[-p[0],p[1]]),holes:s.holes.map(h=>h.map(p=>[-p[0],p[1]]))});

function build(P){
 const{Li,Pi,Ai,Hl,w}=P,a=Li/2,b=Pi/2,hx=a+T,R=b+T,Hlid=Hl+T,Hw=Ai+2*T-Hlid,Hb=Hw-T;
 const nL=odd(Pi,w),nS=odd(Li,w),nE=odd(Hb,w),nW=odd(Li+2*T,w);
 const S=[],D=mkDiv(P,a,b,Hb);
 S.push({n:'Fundo',c:1,pts:[...fe([-a,-b],[a,-b],nS,false,[0,-1]),...fe([a,-b],[a,b],nL,false,[1,0]),...fe([a,b],[-a,b],nS,false,[0,1]),...fe([-a,b],[-a,-b],nL,false,[-1,0])],holes:[]});
 const lw={n:'Lateral longa da base',c:1,pts:[[-b-T,-T],...fe([-b,0],[b,0],nL,true,[0,-1]),[b+T,-T],[b+T,0],...fe([b,0],[b,Hb],nE,false,[1,0]),...fe([-b,Hb],[-b,0],nE,false,[-1,0]),[-b-T,0]],holes:[rect(-(b-5),Hb-8,3,5)]};
 lw.holes.push(...D.lwHoles);S.push(lw,{...mir(lw)});
 S.push({n:'Lateral curta da base',c:2,pts:[...fe([-a,0],[a,0],nS,true,[0,-1]),[a,0],...fe([a,0],[a,Hb],nE,true,[1,0]),[a,Hb],[-a,Hb],...fe([-a,Hb],[-a,0],nE,true,[-1,0]),[-a,0]],holes:[]});
 S.push({n:'Tampa (topo)',c:1,pts:[...fe([-hx,-b],[hx,-b],nW,true,[0,-1]),...fe([hx,-b],[hx,b],nL,false,[1,0]),...fe([hx,b],[-hx,b],nW,false,[0,1]),...fe([-hx,b],[-hx,-b],nL,false,[-1,0])],holes:[]});
 const top=fe([b,Hl],[-b,Hl],nL,true,[0,1]);top[0][0]=R;top[top.length-1][0]=-R;
 const cx=-R+8,tx=cx+8*Math.SQRT1_2,ty=-8-8*Math.SQRT1_2;
 const ls={n:'Lateral da tampa (orelha)',c:1,pts:[[R,0],...top,[-R,-8],...circ(cx,-8,8,180,315,24),[tx-ty,0]],holes:[circ(cx,-8,5.18,0,360,36)]};
 S.push(ls,mir(ls));
 const fr=(r,F)=>[[-hx,0],[hx,0],[hx,r],...fe([hx,r],[-hx,r],nW,F,[0,1]),[-hx,r]];
 S.push({n:'Frente da tampa',c:1,pts:fr(Hl,true),holes:[]},{n:'Fundo da tampa (traseira)',c:1,pts:fr(Hl-3.148,false),holes:[]});
 S.push({n:'Disco do pino',c:2,pts:circ(0,0,5,0,360,36).slice(0,-1),holes:[rect(0,0,3,5)]});
 S.push({n:'Presilha do pino',c:2,pts:rect(0,0,6,5),holes:[]});
 S[0].holes=D.plateHoles;S[3].holes=D.swHoles;S.push(...D.pieces);return{D,S,nL,nS,nE,Hb,Hw,Hlid,ext:[Li+2*T,Pi+2*T,Ai+2*T],lidW:Li+4*T,a,b,hx,Hl,Hr:Hl-3.148,T};
}
const key=p=>Math.round(p[0]*1000)+','+Math.round(p[1]*1000);
// une polígonos adjacentes: remove segmentos coincidentes e encadeia o restante
function unite(polys){
 const cnt=new Map(),segs=[],all=polys.flat(),E=1e-3;
 const split=pl=>{const r=[];for(let i=0;i<pl.length;i++){const p=pl[i],q=pl[(i+1)%pl.length];r.push(p);
  const v=Math.abs(p[0]-q[0])<E,h=Math.abs(p[1]-q[1])<E,m=v?1:0;if(!v&&!h)continue;
  const lo=Math.min(p[m],q[m]),hi=Math.max(p[m],q[m]);
  const mid=all.filter(z=>Math.abs(z[1-m]-p[1-m])<E&&z[m]>lo+E&&z[m]<hi-E).sort((x,y)=>(x[m]-y[m])*(q[m]>p[m]?1:-1));r.push(...mid)}return r};
 polys=polys.map(split);
 for(const pl of polys)for(let i=0;i<pl.length;i++){const p=pl[i],q=pl[(i+1)%pl.length],kp=key(p),kq=key(q);if(kp==kq)continue;
  const k=kp<kq?kp+'|'+kq:kq+'|'+kp;cnt.set(k,(cnt.get(k)||0)+1);segs.push([p,q,k])}
 const seen=new Set(),keep=segs.filter(s=>!seen.has(s[2])&&seen.add(s[2])),adj=new Map();
 keep.forEach((s,i)=>{for(const p of[s[0],s[1]]){const k=key(p);if(!adj.has(k))adj.set(k,[]);adj.get(k).push(i)}});
 const used=new Set(),out=[];
 for(let i=0;i<keep.length;i++){if(used.has(i))continue;used.add(i);const path=[keep[i][0],keep[i][1]];
  for(let dir=0;dir<2;dir++){for(;;){const k=key(path[path.length-1]),nx=(adj.get(k)||[]).find(j=>!used.has(j));if(nx===undefined)break;
    used.add(nx);const q=keep[nx];path.push(key(q[0])==k?q[1]:q[0])}if(!dir)path.reverse()}
  const closed=key(path[0])==key(path[path.length-1]);if(closed)path.pop();out.push({pts:path,closed})}
 return out}
function mkItems(B,mode){const hc='#ff0000';
 const R='#ff0000',{S,a,b,hx,Hl,Hr,T}=B,I=[];
 const one=(s)=>({paths:[{pts:s.pts,color:R,closed:true},...s.holes.map(h=>({pts:h,color:hc,closed:true}))]});
 if(mode=='sep'){S.forEach(s=>{for(let k=0;k<s.c;k++)I.push(one(s))});return I}
 const group=parts=>{const P=[];parts.forEach(([s,f])=>{P.push({pts:s.pts.map(f),color:R})});
  const paths=unite(P.map(p=>p.pts)).map(p=>({...p,color:R}));
  parts.forEach(([s,f])=>s.holes.forEach(h=>paths.push({pts:h.map(f),color:hc,closed:true})));return{paths}};
 const id=p=>p;
 if(mode=='mid'){const rot=g=>({paths:g.paths.map(p=>({...p,pts:p.pts.map(([x,y])=>[-y,x])}))}),Hb=B.Hb;
  I.push(rot(group([[S[0],id],[S[1],([u,v])=>[a+T+v,u]],[S[1],([u,v])=>[-(a+T+v),u]]])));
  I.push(group([[S[4],id],[S[5],([u,v])=>[hx+T+(Hl-v),u]],[S[5],([u,v])=>[-(hx+T+(Hl-v)),u]]]));
  I.push(group([[S[3],id],[S[3],([x,v])=>[x,2*Hb-v]]]));
  I.push(group([[S[7],id],[S[8],([x,y])=>[x,-y]]]));
  for(let k=0;k<2;k++){I.push(one(S[9]));I.push(one(S[10]))}S.slice(11).forEach(s=>{for(let q=0;q<s.c;q++)I.push(one(s))});
  return I}
 I.push(group([[S[0],id],[S[1],([u,v])=>[a+T+v,u]],[S[1],([u,v])=>[-(a+T+v),u]],[S[3],([x,v])=>[x,b+T+v]],[S[3],([x,v])=>[x,-(b+T+v)]]]));
 I.push(group([[S[4],id],[S[5],([u,v])=>[hx+T+(Hl-v),u]],[S[5],([u,v])=>[-(hx+T+(Hl-v)),u]],[S[7],([x,v])=>[x,b+T+(Hl-v)]],[S[8],([x,v])=>[x,-(b+T+(Hr-v))]]]));
 for(let k=0;k<2;k++){I.push(one(S[9]));I.push(one(S[10]))}S.slice(11).forEach(s=>{for(let q=0;q<s.c;q++)I.push(one(s))});
 return I}
function layout(items,maxW){
 items.forEach(it=>{const a=it.paths.flatMap(p=>p.pts);it.bb=[Math.min(...a.map(p=>p[0])),Math.min(...a.map(p=>p[1])),Math.max(...a.map(p=>p[0])),Math.max(...a.map(p=>p[1]))]});
 items.sort((p,q)=>(q.bb[3]-q.bb[1])-(p.bb[3]-p.bb[1]));
 const g=4;let x=g,y=g,rh=0,W=0;const out=[];
 for(const it of items){const w=it.bb[2]-it.bb[0],h=it.bb[3]-it.bb[1];
  if(x+w+g>maxW&&x>g){x=g;y+=rh+g;rh=0}
  out.push({it,tx:x-it.bb[0],ty:y+it.bb[3]});x+=w+g;rh=Math.max(rh,h);W=Math.max(W,x)}
 return{out,W,H:y+rh+g}}
const d=(pts,tx,ty,z)=>'M'+pts.map(p=>(p[0]+tx).toFixed(3)+' '+(ty-p[1]).toFixed(3)).join(' L')+(z?' Z':'');
function svg(L,pv){
 let body='';
 for(const{it,tx,ty}of L.out)for(const p of it.paths)body+=`<path stroke="${p.color}" stroke-width="${pv?1.6:0.1}"${pv?' vector-effect="non-scaling-stroke"':''} fill="none" d="${d(p.pts,tx,ty,p.closed)}"/>`;
 return`<svg xmlns="http://www.w3.org/2000/svg" width="${L.W.toFixed(2)}mm" height="${L.H.toFixed(2)}mm" viewBox="0 0 ${L.W.toFixed(2)} ${L.H.toFixed(2)}">${body}</svg>`}
let cur='',pu='int',pt='hg',pl=true;
const posn=(len,n)=>{const c=(len-n*T)/(n+1);return Array.from({length:n},(_,k)=>-len/2+(k+1)*c+(k+0.5)*T)};
function tabsAlong(L,w,avoid){const n=odd(L,w),s=L/n,r=[];for(let i=1;i<n;i+=2){const t0=-L/2+i*s,t1=t0+s;if(!avoid.some(c=>t1>c-T/2-1&&t0<c+T/2+1))r.push([t0,t1])}return r}
// divisórias: encaixam por dentes em slots (laterais e fundo) e se cruzam por meio-corte
function mkDiv(P,a,b,Hc){
 const{Li,Pi,w}=P,nh=P.nh||0,nv=P.nv||0,hd=P.dTop?Hc:Math.min(P.hd||Hc,Hc),pieces=[],pH=[],lwH=[],swH=[],tH=[],o={pieces,plateHoles:pH,lwHoles:lwH,swHoles:swH,topHoles:tH};
 if(!(nh+nv)||hd<12)return o;
 const ys=posn(Pi,nh),xs=posn(Li,nv),nE=odd(hd,w),sE=hd/nE,et=[],dt=!!P.dTop;o.ys=ys;o.xs=xs;
 for(let i=1;i<nE;i+=2)et.push([i*sE,(i+1)*sE]);
 const topEdge=(tabs,notches)=>{const ev=[...tabs.map(t=>({t:1,a:t[0],b:t[1]})),...notches.map(c=>({t:0,a:c-T/2,b:c+T/2}))].sort((p,q)=>q.b-p.b),r=[];
  ev.forEach(e=>{if(e.t)r.push([e.b,hd],[e.b,hd+T],[e.a,hd+T],[e.a,hd]);else r.push([e.b,hd],[e.b,hd/2],[e.a,hd/2],[e.a,hd])});return r};
 if(nh){const nB=odd(Li,w),tb=tabsAlong(Li,w,[]),tt=dt?tabsAlong(Li,w,xs):[];
  pieces.push({n:'Divisória horizontal',c:nh,pts:[...fe([-a,0],[a,0],nB,false,[0,-1]),...fe([a,0],[a,hd],nE,false,[1,0]),...topEdge(tt,xs),...fe([-a,hd],[-a,0],nE,false,[-1,0])],holes:[]});
  ys.forEach(y=>{tb.forEach(([t0,t1])=>pH.push(rect((t0+t1)/2,y,t1-t0,T)));tt.forEach(([t0,t1])=>tH.push(rect((t0+t1)/2,y,t1-t0,T)));et.forEach(([v0,v1])=>lwH.push(rect(y,(v0+v1)/2,T,v1-v0)))})}
 if(nv){const nB=odd(Pi,w),tbv=tabsAlong(Pi,w,ys),ttv=dt?tabsAlong(Pi,w,[]):[],ev=[];
  tbv.forEach(t=>ev.push({t:1,a:t[0],b:t[1]}));ys.forEach(c=>ev.push({t:0,a:c-T/2,b:c+T/2}));ev.sort((p,q)=>p.a-q.a);
  const bot=[[-b,0]];ev.forEach(e=>{if(e.t)bot.push([e.a,0],[e.a,-T],[e.b,-T],[e.b,0]);else bot.push([e.a,0],[e.a,hd/2],[e.b,hd/2],[e.b,0])});bot.push([b,0]);
  pieces.push({n:'Divisória vertical',c:nv,pts:[...bot,...fe([b,0],[b,hd],nE,false,[1,0]),...topEdge(ttv,[]),...fe([-b,hd],[-b,0],nE,false,[-1,0])],holes:[]});
  xs.forEach(x=>{tbv.forEach(([t0,t1])=>pH.push(rect(x,(t0+t1)/2,T,t1-t0)));ttv.forEach(([t0,t1])=>tH.push(rect(x,(t0+t1)/2,T,t1-t0)));et.forEach(([v0,v1])=>swH.push(rect(x,(v0+v1)/2,T,v1-v0)))})}
 return o}
function buildClosed(P){
 const{Li,Pi,Ai,w}=P,lid=P.lid!==false,a=Li/2,b=Pi/2,H=Ai,nL=odd(Pi,w),nS=odd(Li,w),nE=odd(H,w),D=mkDiv(P,a,b,H);
 const pl=h=>({c:1,pts:[...fe([-a,-b],[a,-b],nS,false,[0,-1]),...fe([a,-b],[a,b],nL,false,[1,0]),...fe([a,b],[-a,b],nS,false,[0,1]),...fe([-a,b],[-a,-b],nL,false,[-1,0])],holes:h});
 const lw={c:2,pts:[[-b-T,-T],...fe([-b,0],[b,0],nL,true,[0,-1]),[b+T,-T],[b+T,0],...fe([b,0],[b,H],nE,false,[1,0]),...(lid?[[b+T,H],[b+T,H+T],...fe([b,H],[-b,H],nL,true,[0,1]),[-b-T,H+T],[-b-T,H]]:[]),...fe([-b,H],[-b,0],nE,false,[-1,0]),[-b-T,0]],holes:D.lwHoles};
 const sw={c:2,pts:[...fe([-a,0],[a,0],nS,true,[0,-1]),[a,0],...fe([a,0],[a,H],nE,true,[1,0]),[a,H],...(lid?fe([a,H],[-a,H],nS,true,[0,1]):[]),[-a,H],...fe([-a,H],[-a,0],nE,true,[-1,0]),[-a,0]],holes:D.swHoles};
 return{S:[pl(D.plateHoles),lw,sw,...(lid?[pl(D.topHoles)]:[]),...D.pieces],a,b,H,nL,nS,nE,lid,D,nD:D.pieces.length}}
function mkItemsC(B,mode){
 const R='#ff0000',{S,a,b,H,lid}=B,base=lid?4:3,id=p=>p,I=[];
 const one=s=>({paths:[{pts:s.pts,color:R,closed:true},...s.holes.map(h=>({pts:h,color:R,closed:true}))]});

// ---- caixa fechada em cunha: fundo plano + tampa inclinada; altura sobe linearmente da frente (h0) ao fundo (H) ----

 const ys=posn(Pi,nh),xs=posn(Li,nv),zt=y=>Math.min(cap,prof(y)),zh=y=>zt(y-T/2),sAt=y=>(y+b)/cs-Ls/2;o.ys=ys;o.xs=xs;

  const top=[],ttv=dt?tabsAlong(Ls,w,[]):[],pos=s=>[-b+(s+Ls/2)*cs,h0+(s+Ls/2)*sn];
  if(dt)[...ttv].sort((p,q)=>q[1]-p[1]).forEach(([t0,t1])=>{const p1=pos(t1),p0=pos(t0);top.push(p1,[p1[0]+T*on[0],p1[1]+T*on[1]],[p0[0]+T*on[0],p0[1]+T*on[1]],p0)});

  pieces.push({n:'Divisória vertical',c:nv,pts:[...bot,...fe([b,0],[b,zb],eb.nE,false,[1,0]),...top,...fe([-b,zf],[-b,0],ef.nE,false,[-1,0])],holes:[]});
  xs.forEach(x=>{tbv.forEach(([t0,t1])=>pH.push(rect(x,(t0+t1)/2,T,t1-t0)));ttv.forEach(([t0,t1])=>tH.push(rect(x,(t0+t1)/2,T,t1-t0)));
   eb.et.forEach(([v0,v1])=>swHb.push(rect(x,(v0+v1)/2,T,v1-v0)));ef.et.forEach(([v0,v1])=>swHf.push(rect(x,(v0+v1)/2,T,v1-v0)))})}

function buildRamp(P){

function ihRampPlace(B){
